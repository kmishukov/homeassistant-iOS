name: Simulator runtime probe
on:
  push:
    branches: [fix/ci-runtime-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Xcode and simulator runtimes
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcrun simctl list runtimes --json
          xcrun simctl runtime list
          xcrun simctl list devices available
